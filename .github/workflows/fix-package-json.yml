name: Fix package.json
on:
  pull_request:

jobs:
  fix_package_json:
    name: Fix package.json
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      checks: write
      contents: write
    steps:
      - uses: profiidev/gluon@d715c4a8bd804db764307ad041e73c1c60ec7382 # v0
        id: app-token
        with:
          url: https://gluon.profidev.io
          profile: pr-automation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - uses: bahmutov/npm-install@20216767ca67f0f7b4d095dc5859c5700a6581cb # v1.12.1
        with:
          useLockFile: false

      - name: Fix package.json
        run: |
          node scripts/generate-exports.js
          npx oxlint --fix
          npx oxfmt package.json

      - uses: profiidev/commit-action@63224804083710db4aa5286dc201bca8e71b0858 # v1.0.0
        with:
          commit_message: "chore: fix package.json exports"
          github_token: ${{ steps.app-token.outputs.token }}
