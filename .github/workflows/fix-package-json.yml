name: Fix package.json
on:
  pull_request:

jobs:
  fix_package_json:
    name: Fix package.json
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - uses: bahmutov/npm-install@v1
        with:
          useLockFile: false

      - name: Fix package.json
        run: |
          node scripts/generate-exports.js
          npx oxlint --fix
          npx oxfmt package.json

      - uses: profiidev/commit-action@63224804083710db4aa5286dc201bca8e71b0858 # v1.0.0
        with:
          commit_message: "chore: fix package.json exports"
          github_token: ${{ steps.app-token.outputs.token }}
