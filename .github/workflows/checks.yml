name: Checks and Validation
on:
  pull_request:

jobs:
  linters:
    name: Run linters
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - uses: bahmutov/npm-install@v1
        with:
          useLockFile: false

      - name: Generate svelte data
        run: |
          npm run sync

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}

      - name: Run linters
        uses: profiidev/rust-lint-action@16801b02ca2bc0441e458d7f713d8a0e8d417927 # v4
        with:
          auto_fix: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          continue_on_error: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          results_file: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'lint-results.json' || '' }}
          svelte: true
          oxlint: true
          oxfmt: true
          git_sign_commits: true
          github_token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Upload lint results
        if: always() && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lint-results
          path: lint-results.json
          retention-days: 5

  build-test:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - uses: bahmutov/npm-install@v1
        with:
          useLockFile: false

      - name: Generate svelte data
        run: |
          npm run sync

      - name: Build project
        run: |
          npm run build
