name: Checks and Validation
on:
  pull_request:

jobs:
  linters:
    name: Run linters
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: bahmutov/npm-install@v1
        with:
          useLockFile: false

      - name: Generate svelte data
        run: |
          npm run sync

      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3
        id: app-token
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}

      - name: Run linters
        uses: profiidev/rust-lint-action@e9435ea64793ce035116e328195eb0c786a46f5a # v4
        with:
          auto_fix: true
          svelte: true
          oxlint: true
          oxfmt: true
          git_sign_commits: true
          github_token: ${{ steps.app-token.outputs.token }}

  build-test:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: bahmutov/npm-install@v1
        with:
          useLockFile: false

      - name: Generate svelte data
        run: |
          npm run sync

      - name: Build project
        run: |
          npm run build
