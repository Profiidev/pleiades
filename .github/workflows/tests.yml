name: Tests
on:
  pull_request:

jobs:
  unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: bahmutov/npm-install@v1
        with:
          useLockFile: false
      - name: Generate svelte data
        run: npm run sync

      - name: Run tests
        run: npm run test:unit -- --reporter junit --reporter default --outputFile test-results-unit.xml

      - name: Upload Test Result File
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-unit
          path: ${{ github.workspace }}/frontend/test-results-unit.xml
          retention-days: 5

  comment_results:
    name: Comment Results to PR
    runs-on: ubuntu-latest
    if: always()
    needs:
      - unit
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          client-id: ${{ secrets.COMMIT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}
      - name: Download Test Results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          merge-multiple: true
          path: test-results
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          files: |
            test-results/**/*.xml
