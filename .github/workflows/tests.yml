name: Tests
on:
  pull_request:

jobs:
  unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - uses: bahmutov/npm-install@v1
        with:
          useLockFile: false
      - name: Generate svelte data
        run: npm run sync

      - name: Run tests
        run: npm run test:unit -- --reporter junit --reporter default --outputFile test-results-unit.xml

      - name: Upload Test Result File
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-results-unit
          path: ${{ github.workspace }}/test-results-unit.xml
          retention-days: 5

  # Test results are published by tests-publish.yml, which also works for PRs from forks
  event_file:
    name: Upload Event File
    runs-on: ubuntu-latest
    steps:
      - name: Upload Event File
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: event-file
          path: ${{ github.event_path }}
          retention-days: 5
